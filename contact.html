<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Adelga Code Electronics</title>
<meta name="description" content="Contact Adelga Code Electronics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header"></header>
<div class="page-head"><div class="wrap"><h1>Contact us</h1><p>The fastest way to reach us is WhatsApp.</p></div></div>
<main class="wrap"><section class="block"><div class="two-col">
  <div class="panel"><h2>Get in touch</h2><ul id="contact-details"></ul>
    <p style="margin-top:18px"><a class="btn btn-green" data-wa>Chat on WhatsApp</a></p></div>
  <div class="panel"><h2>Send a message</h2>
    <form id="contact-form">
      <label for="name">Your name</label><input type="text" id="name" name="name" required>
      <label for="message">Message</label><textarea id="message" name="message" rows="5" required></textarea>
      <p style="margin-top:14px"><button class="btn btn-green" type="submit">Send via WhatsApp</button></p>
    </form></div>
</div></section></main>
<footer id="site-footer"></footer>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
</body>
</html>
